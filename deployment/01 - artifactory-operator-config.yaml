apiVersion: v1
kind: ConfigMap
metadata:
  name: artifactory-operator-config
data:
  # *** Required params ***


  # Location of the cluster : 'intranet' or 'internet'.
  ARTI_OP_CLUSTER_LOCATION: ""

  # The default tenant for projects of the cluster. Used when no tenant is provided in the
  # Kubi Project object.

  # The URL for the Artifactory server where registries & users will be created.
  # Put a full URL to the Artifactory instance, including the scheme. Ex: https://an.artifactory.instance/
  ARTI_OP_ARTIFACTORY_SERVER_URL: ""

  # An Aritfactory admin user that can create repositories and users.
  # The ARTI_OP_ARTIFACTORY_SERVER_PASSWORD variable is also required,
  # but you should set it from a Secret (see the rest of the sample deployment).
  ARTI_OP_ARTIFACTORY_SERVER_USER: ""

  # *** Optional params ***

  # Namespace where passwords for generated Artifactory users will be stored (in K8S Secrets).
  # Default value : 'kube-system'.
  # ARTI_OP_PASSWORDSTORE_BACKEND_NAMESPACE: kube-system

  # Prefix added to the name of Artifactory user Secrets.
  # Default value : 'artifactory-user'.
  # ARTI_OP_PASSWORDSTORE_SECRET_NAME_PREFIX: artifactory-user

  # *** V2 Configuration ***

  # Enable v2 functionality with external API integration
  # Set to "true" to enable v2 functionality
  ARTI_OP_ENABLE_V2: "true"

  # The URL for the external API
  # Default value: https://api-automation.cagip.gca.com/createorupdateapp
  ARTI_OP_EXTERNAL_API_ENDPOINT: "https://api-automation.cagip.gca.com/createorupdateapp"

  # Enable or disable external API calls
  # Set to "false" to disable external API calls
  # Default value: "true"
  ARTI_OP_EXTERNAL_API_ENABLED: "true"
