stages:
  - Build
  - Promote
  - Deploy

Build:
  image: docker-remote.registry.saas.cagip.group.gca/docker:latest
  stage: Build
  variables:
    IMAGE_BASE_NAME: silca-tools-docker-scratch-intranet.registry.saas.cagip.gca/artifactory-operator
  only:
    refs:
      - master
  except:
    - tags
  before_script:
    - docker login -u silca-tools-docker-scratch-intranet -p $AD_PASSWD silca-tools-docker-scratch-intranet.registry.saas.cagip.gca
  script:
    - docker build --build-arg HTTP_PROXY=http://$PROXY_RUNNER --build-arg HTTPS_PROXY=http://$PROXY_RUNNER --network=host -t $IMAGE_BASE_NAME:$(cat version.txt)-master .
    - docker push $IMAGE_BASE_NAME:$(cat version.txt)-master

Mutu Hors Prod:
  image: cagip-hub.registry.saas.cagip.group.gca/alpine-curl
  stage: Deploy
  when: on_success
  variables:
    HTTP_PROXY: http://$PROXY_RUNNER
    HTTPS_PROXY: http://$PROXY_RUNNER
  only:
    refs:
      - master
  script:
    - |
      ./cd-operators.sh 00-Kube-Operators-Dev

Promote Image:
  image: cagip-hub.registry.saas.cagip.group.gca/alpine-curl
  stage: Promote
  variables:
    HTTP_PROXY: http://$PROXY_RUNNER
    HTTPS_PROXY: http://$PROXY_RUNNER
  only:
    refs:
      - stable
  script:
    - |
      curl -u "silca-tools-docker-scratch-intranet:$AD_PASSWD" -X POST "https://silca-tools-docker-scratch-intranet.registry.saas.cagip.gca/v2/promote" -H "Content-Type: application/json" -kv -d "{ \"targetRepo\":\"silca-tools-docker-stable-intranet\", \"dockerRepository\":\"artifactory-operator\", \"tag\":\"$(cat version.txt)-master\", \"targetTag\":\"$(cat version.txt)-stable\" ,\"copy\":\"true\" }"

All Clusters:
  image: cagip-hub.registry.saas.cagip.group.gca/alpine-curl
  stage: Deploy
  variables:
    HTTP_PROXY: http://$PROXY_RUNNER
    HTTPS_PROXY: http://$PROXY_RUNNER
  only:
    refs:
      - stable
  script:
    - |
      ./cd-operators.sh 10-Kube-Operators-Prod