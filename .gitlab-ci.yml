stages:
  - Build
  - Deploy

Build:
  image: docker:latest
  stage: Build
  variables:
    IMAGE_BASE_NAME: silca-tools-docker-scratch-intranet.registry.saas.cagip.gca/artifactory-operator
  only:
    refs:
      - dev
  except:
    - tags
  before_script:
    - docker login -u silca-tools-docker-scratch-intranet -p $AD_PASSWD silca-tools-docker-scratch-intranet.registry.saas.cagip.gca
  script:
    - docker build --build-arg HTTP_PROXY=http://$PROXY_RUNNER --build-arg HTTPS_PROXY=http://$PROXY_RUNNER --network=host -t $IMAGE_BASE_NAME:$(cat version.txt)-${CI_COMMIT_SHA:0:8} .
    - docker push $IMAGE_BASE_NAME:$(cat version.txt)-${CI_COMMIT_SHA:0:8}

Mutu Hors Prod:
  image: agabet/alpine-curl:0.2
  stage: Deploy
  when: on_success
  variables:
    HTTP_PROXY: http://$PROXY_RUNNER
    HTTPS_PROXY: http://$PROXY_RUNNER
  only:
    refs:
      - dev
  script:
    - |
      ./cd-operators.sh 00-Kube-Operators-Dev

All Clusters:
  image: agabet/alpine-curl:0.2
  stage: Deploy
  variables:
    HTTP_PROXY: http://$PROXY_RUNNER
    HTTPS_PROXY: http://$PROXY_RUNNER
  only:
    refs:
      - master
  script:
    - |
      ./cd-operators.sh 10-Kube-Operators-Prod