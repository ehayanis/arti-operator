stages:
  - Build
  - Promote
  - Deploy

Build:
  image: docker:latest
  stage: Build
  variables:
    IMAGE_BASE_NAME: silca-tools-docker-scratch-intranet.registry.saas.cagip.gca/artifactory-operator
  only:
    refs:
      - dev
  except:
    - tags
  before_script:
    - docker login -u silca-tools-docker-scratch-intranet -p $AD_PASSWD silca-tools-docker-scratch-intranet.registry.saas.cagip.gca
  script:
    - docker build --build-arg HTTP_PROXY=http://$PROXY_RUNNER --build-arg HTTPS_PROXY=http://$PROXY_RUNNER --network=host -t $IMAGE_BASE_NAME:$(cat version.txt)-dev .
    - docker push $IMAGE_BASE_NAME:$(cat version.txt)-dev

