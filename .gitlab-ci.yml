stages:
  - Build
  - Deploy

Build:
  image: docker:latest
  stage: Build
  variables:
    IMAGE_BASE_NAME: silca-tools-docker-scratch-intranet.registry.saas.cagip.gca/artifactory-operator
  only:
    refs:
      - master
  except:
    - tags
  before_script:
    - docker login -u silca-tools-docker-scratch-intranet -p $AD_PASSWD silca-tools-docker-scratch-intranet.registry.saas.cagip.gca
  script:
    - docker build --build-arg HTTP_PROXY=http://$PROXY_RUNNER --build-arg HTTPS_PROXY=http://$PROXY_RUNNER --network=host -t $IMAGE_BASE_NAME:$(cat version.txt)-${CI_COMMIT_SHA:0:8} .
    - docker push $IMAGE_BASE_NAME:$(cat version.txt)-${CI_COMMIT_SHA:0:8}

Mutu Prod:
  image: agabet/alpine-curl:0.2
  stage: Deploy
  when: on_success
  variables:
    HTTP_PROXY: http://$PROXY_RUNNER
    HTTPS_PROXY: http://$PROXY_RUNNER
  script:
    - |
      INVENTORY=$(curl -kL -u ${AWX_LOGIN}:${AWX_PASSWORD}  -H "Content-Type: application/json"  https://awx.os.prodinfo.gca/api/v2/inventories?name=Ansible%20-%20Kube%20-%20Mutu | jq '.results | .[0].id')
      JOB_TEMPLATE=$(curl -kL -u ${AWX_LOGIN}:${AWX_PASSWORD}  -H "Content-Type: application/json" https://awx.os.prodinfo.gca/api/v2/job_templates?name="Kube-Deployer-Arti" | jq '.results | .[0].id')
      JOB_RUNNING_ID=$(curl -kv -u ${AWX_LOGIN}:${AWX_PASSWORD} -X POST -H "Content-Type: application/json" https://awx.os.prodinfo.gca/api/v2/job_templates/$JOB_TEMPLATE/launch/ -d "{\"inventory\":$INVENTORY}")

