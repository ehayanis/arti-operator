---
apiVersion: apiextensions.k8s.io/v1beta1
kind: CustomResourceDefinition
metadata:
  name: projects.ca-gip.github.com
spec:
  group: ca-gip.github.com
  versions:
    - name: v1
      served: true
      storage: true
  scope: Cluster
  names:
    plural: projects
    singular: project
    kind: Project
    shortNames:
      - project
  additionalPrinterColumns:
    - name: Tenant
      type: string
      description: The customer aka company owning the cluster
      JSONPath: .spec.tenant
    - name: Environment
      type: string
      description: The environment for this namespace
      JSONPath: .spec.environment
    - name: Project
      type: string
      description: The project name ( without environment )
      JSONPath: .spec.project
    - name: Stages
      type: string
      description: Stages allowed for this project, can be mapped to registry or CI/CD
      JSONPath: .spec.stages
  validation:
    # openAPIV3Schema is the schema for validating custom objects.
    openAPIV3Schema:
      properties:
        spec:
          required:
            - project
          properties:
            whitelistAddresses:
              type: array
              items:
                type: string
            tenant:
              type: string
            environment:
              type: string
              enum:
                - development
                - integration
                - production
            project:
              type: string
            stages:
              type: array
              items:
                type: string
                enum:
                  - scratch
                  - staging
                  - stable
...